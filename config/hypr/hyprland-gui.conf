# Generated by HyprMod

# Settings
input:sensitivity = 0.0

# Monitors
monitor = eDP-1, 1920x1080@60.00Hz, 0x0, 1.2, cm, srgb

# Keybinds
unbind = , XF86AudioRaiseVolume
binde = , XF86AudioRaiseVolume, exec, pamixer -i 2 && dunstify -a "Volume" -u normal -h int:value:$(pamixer --get-volume) -h string:x-dunst-stack-tag:volume "Volume" "$(pamixer --get-volume)%"
unbind = , XF86AudioLowerVolume
binde = , XF86AudioLowerVolume, exec, pamixer -d 2 && dunstify -a "Volume" -u normal -h int:value:$(pamixer --get-volume) -h string:x-dunst-stack-tag:volume "Volume" "$(pamixer --get-volume)%"
unbind = , XF86MonBrightnessUp
binde = , XF86MonBrightnessUp, exec, brightnessctl set 5%+ && dunstify -a "Brightness" -u normal -h int:value:$(brightnessctl -m | cut -d',' -f4 | tr -d '%') -h string:x-dunst-stack-tag:brightness "Brightness" "$(brightnessctl -m | cut -d',' -f4)"
unbind = , XF86MonBrightnessDown
binde = , XF86MonBrightnessDown, exec, brightnessctl set 5%- && dunstify -a "Brightness" -u normal -h int:value:$(brightnessctl -m | cut -d',' -f4 | tr -d '%') -h string:x-dunst-stack-tag:brightness "Brightness" "$(brightnessctl -m | cut -d',' -f4)"
